name: Probe

# A fast way to compile for a platform nobody here has. The full CI takes six
# minutes; this answers in one, which is what makes writing native macOS code
# blind bearable.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: What the machine has
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType
          cargo run --release -- --diagnose

      - name: The tone check
        continue-on-error: true
        run: cargo run --release -- --self-test

      # The other tap: everything the machine plays, rather than one process.
      - name: The global tap
        continue-on-error: true
        run: cargo run --release -- --source "Everything" --seconds 3
