[package]
name = "output-decibel-meter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Live loudness metering of what a program actually outputs — per-application or per-device capture, reported as EBU R128 loudness and true peak. Linux today; Windows and macOS list but cannot yet capture an output."
repository = "https://github.com/Le-Syl21/output-decibel-meter"
keywords = ["audio", "loudness", "ebu-r128", "metering", "loopback"]
categories = ["multimedia::audio"]
# Two binaries, so `cargo run` has to be told which one it is.
default-run = "output-decibel-meter"

[lib]
name = "output_decibel_meter"
path = "src/lib.rs"

[[bin]]
name = "output-decibel-meter"
path = "src/main.rs"

[[bin]]
name = "output-decibel-meter-gui"
path = "src/gui.rs"
required-features = ["gui"]

[features]
default = ["pipewire"]
# The PipeWire backend: per-program capture, and outputs tapped at their real
# monitors. On by default because on Linux it is the only listing that measures
# what it says it measures; `--no-default-features` drops it, and its build
# dependencies with it, leaving plain device capture through ALSA.
pipewire = ["dep:pipewire"]
# The meter window. Kept optional so `cargo add output-decibel-meter` stays a
# small dependency for anyone who only wants the numbers.
gui = ["dep:eframe", "dep:egui"]

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.1"
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
eframe = { version = "0.36.1", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36.1", optional = true }

[lints.rust]
missing_docs = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
# v0_3_44 for `target.object`, which is what says *which* program to tap.
pipewire = { version = "0.10.0", optional = true, features = ["v0_3_44"] }
